name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  # The go directive in go.mod stays at 1.22; this is the toolchain CI builds
  # with. 1.22 itself no longer links runnable binaries on current macOS
  # runners ("dyld: missing LC_UUID load command").
  GO_VERSION: "1.23"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        # v7+ of the action is what understands golangci-lint v2, which is the
        # format .golangci.yml is written in. v6 installs v1 and rejects it.
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.1
          args: --timeout=5m

  test:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download deps
        run: go mod download

      - name: Run unit tests
        # bash on every OS: PowerShell splits -coverprofile=coverage.out and Go
        # ends up being asked for a package called ".out".
        shell: bash
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./internal/...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  vuln:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # The govulncheck action unpacks its own module cache; layering that
          # on a populated one fails with "tar: ...: Cannot open: File exists".
          cache: false

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          BIN=cortex-${{ matrix.goos }}-${{ matrix.goarch }}
          [ "${{ matrix.goos }}" = "windows" ] && BIN="${BIN}.exe"
          go build -trimpath -ldflags "-s -w" -o "dist/$BIN" ./cmd/cortex

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cortex-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 7

  e2e:
    name: E2E against fixture
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install semgrep bandit

      - name: Build cortex
        run: make build

      - name: Run E2E
        run: make test-e2e
