name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  # The go directive in go.mod stays at 1.22; this is the toolchain CI builds
  # with, and it has to keep moving: 1.22 no longer links runnable binaries on
  # current macOS runners ("dyld: missing LC_UUID"), and govulncheck fails the
  # build on standard-library CVEs fixed in later releases.
  GO_VERSION: "1.27"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        # v7+ of the action is what understands golangci-lint v2, which is the
        # format .golangci.yml is written in. v6 installs v1 and rejects it.
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.1
          args: --timeout=5m

  test:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download deps
        run: go mod download

      - name: Run unit tests
        # bash on every OS: PowerShell splits -coverprofile=coverage.out and Go
        # ends up being asked for a package called ".out".
        shell: bash
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./internal/...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  vuln:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # The govulncheck action unpacks its own module cache; layering that
          # on a populated one fails with "tar: ...: Cannot open: File exists".
          cache: false

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          BIN=cortex-${{ matrix.goos }}-${{ matrix.goarch }}
          [ "${{ matrix.goos }}" = "windows" ] && BIN="${BIN}.exe"
          go build -trimpath -ldflags "-s -w" -o "dist/$BIN" ./cmd/cortex

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cortex-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 7

  e2e:
    name: E2E against fixture
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install scanners
        env:
          GITLEAKS_VERSION: "8.30.1"
          OSV_VERSION: "2.5.1"
        run: |
          python -m pip install --upgrade pip
          # Bandit has no native SARIF output: without the formatter every one
          # of its findings is lost, and the contract rows it covers fail.
          pip install semgrep bandit bandit-sarif-formatter

          npm install -g --no-fund --no-audit \
            eslint@8 eslint-plugin-security @microsoft/eslint-formatter-sarif

          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

          sudo curl -sSL -o /usr/local/bin/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          sudo chmod +x /usr/local/bin/osv-scanner

      - name: Point ESLint at the global plugins
        run: |
          echo "CORTEX_ESLINT_PLUGINS_DIR=$(npm root -g)" >> "$GITHUB_ENV"
          echo "CORTEX_ESLINT_FORMATTER=$(npm root -g)/@microsoft/eslint-formatter-sarif" >> "$GITHUB_ENV"

      - name: Build cortex
        run: make build

      - name: Run E2E
        run: make test-e2e
