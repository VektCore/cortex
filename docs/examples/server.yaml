# Configuration for `cortex serve` — the deployment where the engine runs on
# your server and clients connect with an API key.
#
# Mounted at /etc/cortex/server.yaml by docker-compose.server.yml.

version: "1"

server:
  addr: ":8080"
  # Must be a mounted volume: it holds every project's history.
  data_dir: /var/lib/cortex
  # Each analysis clones a repository and runs several scanners, so useful
  # concurrency is low. Two is a sensible start for a 4-core box.
  workers: 2

  # Where issued API keys, analyses and their SARIF live. Empty keeps them in
  # files under data_dir, which is what lets a single binary plus a volume be
  # the whole deployment; set it and they go to PostgreSQL, which is what you
  # want when several instances share one key table, or when credentials have
  # to be auditable with a query instead of by reading JSON off a disk.
  #
  # Cortex applies its own schema on connect and the statements are
  # CREATE ... IF NOT EXISTS, so a fresh database needs to exist and nothing
  # needs to be run in it. There is no migration step and no Alembic here.
  #
  # The host is the compose service name in docker-compose.server.yml, resolved
  # on the compose network — the database publishes no port on the host.
  # sslmode=disable because the stock postgres image serves no TLS and this
  # connection never leaves the Docker bridge; asking for `require` against it
  # just fails to connect. Change both ends together if you terminate TLS.
  #
  # The password is read from the environment, so it stays out of this file
  # even though this file already holds the static keys. deploy-server.sh
  # generates it into .env as a hex string, which needs no URL-escaping here.
  database: postgres://cortex:${CORTEX_DB_PASSWORD}@cortex-db:5432/cortex?sslmode=disable

  # Lifetime `cortex keys issue` gives a key when --ttl is not passed. Keys
  # expire by design: a credential that lets its holder upload archives for this
  # server to unpack should stop working on its own, rather than live in a file
  # until somebody remembers to delete it.
  api_key_ttl: 90d

  # Static keys, for bootstrapping a fresh deployment before there is anything
  # to issue keys with. One entry per client: the name appears in the logs and
  # on each analysis, so work is attributable without ever printing a key.
  #
  # These never expire, which is why they are not how a client is given
  # long-term access: `cortex keys issue --client acme --ttl 90d` is.
  #
  # Generate one with: openssl rand -hex 32
  # Keep them in the environment, never in this file.
  api_keys:
    - name: acme
      key: ${CLIENT_ACME_KEY}
    # - name: globex
    #   key: ${CLIENT_GLOBEX_KEY}

  # Shared secret for GitHub push webhooks. Connecting a repository is then just
  # pasting the URL and this secret into its Settings → Webhooks — nothing is
  # installed in the repository. Empty keeps the endpoint closed.
  webhook_secret: ${GITHUB_WEBHOOK_SECRET}
  # Which branches a push triggers an analysis for. Empty means the
  # repository's own default branch.
  webhook_branches: []

  # Archive upload: the deployment where the client's pipeline sends the source
  # instead of granting this server access to its repositories. Nothing here
  # reaches back into the client's forge, so no clone credential is needed.
  #
  # The limits are the security posture of that endpoint. An authenticated
  # client can otherwise fill this disk with one request, and every byte arrives
  # before anything has been validated.
  upload:
    enabled: true
    # The upload itself, refused while still streaming.
    max_archive_bytes: 268435456      # 256 MiB
    # What it may expand into: the guard against a zip bomb, which is small on
    # the wire by construction.
    max_extracted_bytes: 2147483648   # 2 GiB
    # A million empty files exhausts inodes without tripping a size limit.
    max_entries: 200000

  # Writing results back into GitHub is what makes a repository covered without
  # anything installed in it: the findings become Code Scanning alerts and the
  # gate verdict a commit status, the way SonarCloud's automatic analysis does.
  github:
    # Needs security-events:write (Code Scanning) and statuses:write (the
    # commit status). A GitHub App installation token is the right shape.
    token: ${GITHUB_PUBLISH_TOKEN}
    # Where this server is reachable, used as the link on the commit status.
    public_url: https://sast.example.com
    # api_url: https://github.example.com/api/v3   # GitHub Enterprise Server

# Two scanners reporting the same weakness at the same line count once, and
# the agreement is recorded rather than discarded — tools that concur are a
# confidence signal. Only findings carrying a CWE are grouped: without one
# there is no evidence that two different rules describe the same thing, and
# guessing would drop real findings.
#
# Off by default because it only pays where scanners overlap on one language
# (Semgrep and Bandit on Python, Semgrep and gosec on Go). On a service that
# takes any client's repository, that overlap is the normal case rather than
# the exception. It does nothing when the engines cover disjoint ground —
# code, secrets and dependencies never land on the same line.
# DISABLED until the dependency grouping lands. Grouping is by
# (CWE, file, start line), and every dependency advisory sits at
# <lockfile>:1 — so six distinct prototype-pollution CVEs sharing CWE-1321 on
# one lockfile line collapse into one finding and five vanish. Measured on a
# real repository: two groups, six advisories each, silently lost.
#
# Re-enable once findings from a lockfile are grouped by the advisory and the
# package rather than by the line they were noticed on.
dedup:
  cross_scanner: false

# Third-party code is not what the client is paying to have reviewed.
exclude:
  - node_modules/
  - vendor/
  - .venv/
  - venv/
  - target/
  - dist/
  - build/
  - "*.min.js"

severity:
  escalate:
    CWE-89: critical      # SQL injection
    CWE-78: critical      # OS command injection
    CWE-94: critical      # code injection
    CWE-502: critical     # insecure deserialization

scanners:
  semgrep:
    enabled: true
    timeout: 20m          # client monorepos are bigger than any fixture
    options:
      # Named rulesets, not "auto": auto resolves the set on Semgrep's servers
      # from project metadata, which needs their metrics on and can change
      # between runs. A service has to be reproducible.
      config: "p/security-audit,p/owasp-top-ten,p/secrets"
      rules_dir: /usr/share/cortex/rules
  bandit:
    enabled: true
  gosec:
    enabled: true
  gitleaks:
    enabled: true
    options:
      # Never verify someone else's credentials against their provider without
      # asking them first.
      verify: "false"
  osv:
    enabled: true
  eslint_security:
    enabled: true
  spotbugs:
    enabled: false        # needs `mvn package` inside the client's repo
  security_code_scan:
    enabled: false        # needs the analyzer wired into their .csproj

reachability:
  enabled: true
  demote: true

# The gate verdict is reported per analysis. It does not fail the service — the
# client decides what to do with "gate": "failed".
gate:
  rules:
    - name: no-critical
      severity: critical
      threshold: ">=1"
    - name: few-high
      severity: high
      threshold: ">10"

# The server keeps state per project under data_dir, so this section is only
# about the engine's own default; the server overrides the path per analysis.
state:
  enabled: true

publishers:
  # The server stores the SARIF itself and serves it from
  # /api/v1/analyses/{id}/sarif, so no publisher is needed.
  filesystem:
    enabled: false
  korvlabs:
    enabled: false
