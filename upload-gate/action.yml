name: Cortex Upload Gate
description: >
  Send this repository's source to a Cortex server, wait for the verdict, and
  fail the job when the Quality Gate does not pass. Nothing is installed and no
  access to the repository is granted: the pipeline pushes the code out.
author: VektCore

branding:
  icon: shield
  color: purple

inputs:
  server-url:
    description: Base URL of the Cortex server, e.g. https://sast.example.com.
    required: true
  api-key:
    description: API key issued for this client. Pass a secret, never a literal.
    required: true
  project:
    description: >
      Stable identifier the finding history is kept under. Changing it resets
      the history, which turns every known finding back into a new one.
    required: true
  path:
    description: Directory inside the repository to package.
    required: false
    default: "."
  gate-on:
    description: >
      Which number decides the build: "gate" is the server's own verdict over
      every finding; "new" fails only on findings this project had never seen,
      which is what a repository with existing debt wants.
    required: false
    default: gate
  timeout:
    description: Seconds to wait for the analysis before giving up.
    required: false
    default: "1800"
  poll-interval:
    description: Seconds between status checks.
    required: false
    default: "10"
  fail-on-gate:
    description: Fail the step when the verdict is negative.
    required: false
    default: "true"
  upload-sarif:
    description: >
      Upload the findings to this repository's Code Scanning. Needs the
      security-events:write permission.
    required: false
    default: "true"

outputs:
  passed:
    description: true or false — the verdict this action gated on.
    value: ${{ steps.gate.outputs.passed }}
  analysis-id:
    description: Identifier of the analysis on the server.
    value: ${{ steps.gate.outputs.analysis_id }}
  findings:
    description: Total findings after deduplication.
    value: ${{ steps.gate.outputs.findings }}
  new-findings:
    description: Findings this project had never seen before.
    value: ${{ steps.gate.outputs.new_findings }}
  sarif:
    description: Path to the downloaded SARIF document.
    value: ${{ steps.gate.outputs.sarif }}

runs:
  using: composite
  steps:
    - id: gate
      shell: bash
      env:
        # Everything travels by environment, never interpolated into the script:
        # an input expanded inline lands in the runner log verbatim, and one of
        # these is a credential. That argument is about the log and covers only
        # the log: an environment variable is still exposed the moment it is
        # expanded into a command's arguments, where anyone who can run ps on
        # the runner reads it. The key therefore reaches curl through a config
        # file on stdin — see cortex_curl below.
        CORTEX_URL: ${{ inputs.server-url }}
        CORTEX_KEY: ${{ inputs.api-key }}
        CORTEX_PROJECT: ${{ inputs.project }}
        CORTEX_PATH: ${{ inputs.path }}
        CORTEX_GATE_ON: ${{ inputs.gate-on }}
        CORTEX_TIMEOUT: ${{ inputs.timeout }}
        CORTEX_INTERVAL: ${{ inputs.poll-interval }}
      run: |
        set -uo pipefail

        server="${CORTEX_URL%/}"
        archive="$RUNNER_TEMP/cortex-src.zip"
        body="$RUNNER_TEMP/cortex-response.json"

        # curl's config-file parser treats a quoted value as C-ish: a backslash
        # or a double quote in the key has to survive it, or the header carries
        # a different credential and the server answers 401 with no hint why.
        # Escaped once here rather than at every call site.
        key_escaped="${CORTEX_KEY//\\/\\\\}"
        key_escaped="${key_escaped//\"/\\\"}"
        # Nothing below needs the raw value, and a variable still in the
        # environment is inherited by every child — curl, git, jq, zip. On a
        # shared self-hosted runner /proc/<pid>/environ is same-uid readable,
        # and those jobs run as one user.
        unset CORTEX_KEY

        # Anything the server said is untrusted text on its way into a log.
        # A newline lets it emit its own ::workflow-command:: — ::stop-commands::
        # in particular switches off command processing for the rest of the
        # step — so newlines and carriage returns are flattened before any
        # response text is echoed.
        one_line() { tr '\r\n' '  ' | cut -c1-500; }

        # Every authenticated call goes through here. The credential is written
        # on curl's stdin as a config file, so it never appears in this
        # process's argv: a self-hosted runner is shared, and -H "Authorization:
        # Bearer $CORTEX_KEY" hands the key to every `ps` on the host for the
        # life of the request. Only the *quoted* form is honoured — curl
        # silently ignores `header = Authorization: …` without the quotes, and
        # the request then goes out unauthenticated. Same approach as
        # scripts/smoke.sh in this repository; keep the two in step.
        cortex_curl() {
          printf 'header = "Authorization: Bearer %s"\n' "$key_escaped" \
            | curl -sS --config - "$@"
        }

        # git archive respects .gitignore and carries no .git directory, so the
        # server receives the tracked tree and nothing else — no build output,
        # no local credentials, no history.
        if ! git archive --format=zip -o "$archive" HEAD -- "$CORTEX_PATH"; then
          echo "::error::could not package $CORTEX_PATH with git archive"
          exit 1
        fi
        echo "packaged $(du -h "$archive" | cut -f1) from $GITHUB_SHA"

        code=$(cortex_curl -o "$body" -w '%{http_code}' \
          -X POST "$server/api/v1/analyses/upload" \
          -F "archive=@$archive" \
          -F "project=$CORTEX_PROJECT" \
          -F "commit=$GITHUB_SHA" \
          -F "branch=$GITHUB_REF_NAME" \
          -F "repository=github.com/$GITHUB_REPOSITORY")

        if [ "$code" != "202" ]; then
          echo "::error::the server refused the upload (HTTP $code)"
          { jq -r '.error // .' < "$body" 2>/dev/null || cat "$body"; } | one_line
          exit 1
        fi

        id=$(jq -r .id < "$body")
        echo "analysis_id=$id" >> "$GITHUB_OUTPUT"
        echo "analysis $id queued"

        deadline=$(( $(date +%s) + CORTEX_TIMEOUT ))
        status=""
        while [ "$(date +%s)" -lt "$deadline" ]; do
          sleep "$CORTEX_INTERVAL"
          code=$(cortex_curl -o "$body" -w '%{http_code}' \
            "$server/api/v1/analyses/$id")
          if [ "$code" != "200" ]; then
            echo "::warning::status check returned HTTP $code; retrying"
            continue
          fi
          status=$(jq -r .status < "$body")
          [ "$status" = "completed" ] || [ "$status" = "failed" ] && break
          echo "  $status…"
        done

        if [ "$status" != "completed" ] && [ "$status" != "failed" ]; then
          echo "::error::the analysis did not finish within ${CORTEX_TIMEOUT}s"
          exit 1
        fi
        if [ "$status" = "failed" ]; then
          reason=$(jq -r '.error // "no reason given"' < "$body" | one_line)
          echo "::error::the analysis failed: $reason"
          exit 1
        fi

        gate=$(jq -r '.gate // "unknown"' < "$body")
        findings=$(jq -r '.findings // 0' < "$body")
        new=$(jq -r '.new_findings // 0' < "$body")
        ran=$(jq -r '.scanners_ran // 0' < "$body")
        errs=$(jq -r '.scanner_errors // {} | length' < "$body")

        echo "findings=$findings"     >> "$GITHUB_OUTPUT"
        echo "new_findings=$new"      >> "$GITHUB_OUTPUT"

        # The findings report comes back whatever the verdict: a passing build
        # still has to show what was found.
        #
        # The status is checked rather than ignored. Without it a 401 or 500
        # writes its JSON error body to cortex.sarif, which is then handed to
        # upload-sarif and published to Code Scanning as if it were findings —
        # quietly, because that step tolerates failure.
        sarif="$RUNNER_TEMP/cortex.sarif"
        code=$(cortex_curl -o "$sarif" -w '%{http_code}' \
          "$server/api/v1/analyses/$id/sarif") || code=000
        if [ "$code" = "200" ]; then
          echo "sarif=$sarif" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::could not download the SARIF (HTTP $code); the verdict below still stands"
          rm -f "$sarif"
        fi

        if [ "$CORTEX_GATE_ON" = "new" ]; then
          [ "$new" -eq 0 ] && passed=true || passed=false
          criterion="no finding this project had not seen before"
          detail="$new new"
        else
          [ "$gate" = "passed" ] && passed=true || passed=false
          criterion="the server's Quality Gate"
          detail="$findings finding(s)"
        fi
        echo "passed=$passed" >> "$GITHUB_OUTPUT"

        if [ "$passed" = true ]; then
          verdict="**PASSED**"
        else
          # Naming the number that failed it. "FAILED (no new findings)" reads
          # as a contradiction: the parenthetical is the criterion, not the
          # result, and nobody reads it that way.
          verdict="**FAILED** — $detail, and the criterion is $criterion"
        fi

        {
          echo "## Cortex — security analysis"
          echo
          echo "| | |"
          echo "|---|---|"
          echo "| Verdict | $verdict |"
          echo "| Quality Gate | $gate |"
          echo "| Findings | $findings  ($new new to this project) |"
          echo "| By severity | $(jq -rc '.by_severity // {}' < "$body") |"
          echo "| Scanners | $ran ran, $errs failed |"
          echo "| Analysis | \`$id\` |"
          echo
          # A run where most tools failed must not read as a clean repository.
          if [ "$errs" -gt 0 ]; then
            echo "> $errs scanner(s) did not complete. Every count here is a"
            echo "> floor, not a total."
            echo
            jq -r '.scanner_errors // {} | to_entries[] | "- **\(.key)**: \(.value)"' < "$body"
            echo
          fi
        } >> "$GITHUB_STEP_SUMMARY"

        # The detail. A count alone tells nobody what to do, and with
        # upload-sarif off — which a private repository without Advanced
        # Security has no choice about — there is nowhere else to go and look.
        if [ -s "$sarif" ]; then
          jq -r '
            def sev:
              (.properties["security-severity"] // "0" | tonumber) as $s
              | if   $s >= 9 then "critical"
                elif $s >= 7 then "high"
                elif $s >= 4 then "medium"
                elif $s >  0 then "low"
                else "info" end;
            def rank:
              {critical:0, high:1, medium:2, low:3, info:4}[sev];
            def uri:
              .locations[0].physicalLocation.artifactLocation.uri // "(no file)";
            # The top-level path component, which is what makes a vendored
            # directory or a duplicated lockfile visible as one row instead of
            # a hundred. Split the path, never the "path:line" string.
            def area:
              uri | split("/")[0];
            def loc:
              uri + ":"
              + ((.locations[0].physicalLocation.region.startLine // 0) | tostring);
            [.runs[].results[]] as $all
            | ($all | length) as $total

            # Where they are, before what they are: a repository with a
            # vendored directory or two lockfiles reports the same finding
            # many times, and the shape of that is visible here and nowhere
            # else.
            | "### Where they are", "",
              "| Area | Findings |", "|---|---:|",
              ( $all
                | group_by(area)
                | map({area: (.[0] | area), n: length})
                | sort_by(-.n) | .[:12][]
                | "| `\(.area)` | \(.n) |" ),
              "",
              "<details><summary><b>All \($total) findings</b> — most severe first</summary>",
              "",
              "| Severity | Rule | Location | Scanner |",
              "|---|---|---|---|",
              ( $all
                | sort_by(rank, .ruleId)
                | .[:400][]
                | "| \(sev) | `\(.ruleId // "?")` | `\(loc)` | \(.properties["cortex/scanner"] // "?") |" ),
              "",
              ( if $total > 400
                then "_Showing the 400 most severe of \($total). The full SARIF is attached to this run as an artifact._"
                else "" end ),
              "</details>"
          ' < "$sarif" >> "$GITHUB_STEP_SUMMARY" || \
            echo "_Could not render the findings table; the SARIF artifact has them._" \
              >> "$GITHUB_STEP_SUMMARY"
        fi

        echo "gate_failed=$( [ "$passed" = true ] && echo 0 || echo 1 )" >> "$GITHUB_ENV"

    # Always, whatever upload-sarif says. A private repository without
    # Advanced Security cannot publish to Code Scanning, and then the job
    # summary is the only trace of what was found — truncated, and gone when
    # the run is cleaned up. The document itself has every finding, with its
    # fingerprint and the code around it.
    - name: Attach the SARIF to the run
      if: ${{ steps.gate.outputs.sarif != '' }}
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: cortex-sarif-${{ steps.gate.outputs.analysis-id }}
        path: ${{ steps.gate.outputs.sarif }}
        retention-days: 30

    - name: Upload SARIF to Code Scanning
      if: ${{ inputs.upload-sarif == 'true' && steps.gate.outputs.sarif != '' }}
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.gate.outputs.sarif }}
        category: cortex

    - name: Enforce the verdict
      if: ${{ inputs.fail-on-gate == 'true' }}
      shell: bash
      run: |
        if [ "${gate_failed:-0}" != "0" ]; then
          echo "::error::Cortex did not pass; stopping the pipeline"
          exit 1
        fi
        echo "Cortex passed"
