rules:
  - id: cortex-javascript-ssrf
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      SSRF: the parameter "$NAME" is used as the target URL of an outbound
      request without validation. An attacker-controlled URL can reach internal
      services (169.254.169.254, localhost, cluster DNS). Validate the host
      against an allowlist before requesting it.
    metadata:
      cwe:
        - "CWE-918: Server-Side Request Forgery (SSRF)"
      category: security
      confidence: MEDIUM
      security-severity: "8.0"
      references:
        - https://owasp.org/www-community/attacks/Server_Side_Request_Forgery
    # ------------------------------------------------------------------
    # Sources: values that arrive as a function parameter.
    #
    # The arrow-function case used to be written as `pattern-inside: (...) =>
    # { ... }` with no binding on the parameter list, which does not taint the
    # parameters — it taints *every identifier* appearing anywhere inside any
    # arrow function, including imported helpers, module constants and local
    # objects. Arrow parameters do bind, as long as each arity/body shape is
    # spelled out; doing so is what keeps `https.request(options, ...)` with a
    # hardcoded `options` out of the results.
    # ------------------------------------------------------------------
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  function $F(..., $NAME, ...) { ... }
              - pattern-inside: |
                  async function $F(..., $NAME, ...) { ... }
              # Arrow functions, block body.
              - pattern-inside: |
                  ($NAME) => { ... }
              - pattern-inside: |
                  (..., $NAME, ...) => { ... }
              - pattern-inside: |
                  async ($NAME) => { ... }
              - pattern-inside: |
                  async (..., $NAME, ...) => { ... }
              # Arrow functions, concise (expression) body.
              - pattern-inside: |
                  ($NAME) => ...
              - pattern-inside: |
                  (..., $NAME, ...) => ...
              - pattern-inside: |
                  async ($NAME) => ...
              - pattern-inside: |
                  async (..., $NAME, ...) => ...
          - pattern: $NAME
    pattern-sanitizers:
      - pattern: new URL(...).hostname
      - pattern: $ALLOWLIST.includes(...)

    # ------------------------------------------------------------------
    # Sinks.
    #
    # Matching a sink by *name* alone ("anything called http.get") is what
    # made this rule unusable: on a real frontend it fired 100+ times inside
    # MSW mock handlers, where `http` is `import { http } from 'msw'` — an
    # object that *declares* routes and never performs a request. Same trap
    # for `request` (an MSW/Express handler argument) and for any local
    # variable a developer happens to name `axios`.
    #
    # Every sink below therefore binds its receiver to an *import of a real
    # HTTP client module* ($CLIENT), so the identifier has to resolve to
    # axios/node http/got/... and not merely be spelled like one. Semgrep
    # resolves the local alias for us, so `import ax from 'axios'; ax.get(u)`
    # still matches.
    #
    # `focus-metavariable: $URL` is the second half of the fix: in taint mode
    # a sink fires when taint reaches *anywhere* inside the matched
    # expression, so `http.get('/users', async ({ request }) => { ... })` used
    # to be reported because of a tainted identifier in the callback — not in
    # the URL. SSRF is specifically "taint reaches the request target", so the
    # sink is narrowed to the URL argument.
    # ------------------------------------------------------------------
    pattern-sinks:
      # 1. WHATWG fetch. Genuinely a global (browser + Node >= 18), so there
      #    is no import to bind to; left matching by name deliberately.
      - patterns:
          - pattern: fetch($URL, ...)
          - focus-metavariable: $URL

      # 2. A method call on a symbol imported from a real HTTP client module.
      - patterns:
          - pattern-either: &http-client-import
              # axios
              - pattern-inside: |
                  import $CLIENT from 'axios'
                  ...
              - pattern-inside: |
                  import * as $CLIENT from 'axios'
                  ...
              - pattern-inside: |
                  const $CLIENT = require('axios')
                  ...
              # node core http / https (bare and node: specifier)
              - pattern-inside: |
                  import $CLIENT from 'http'
                  ...
              - pattern-inside: |
                  import * as $CLIENT from 'http'
                  ...
              - pattern-inside: |
                  const $CLIENT = require('http')
                  ...
              - pattern-inside: |
                  import $CLIENT from 'https'
                  ...
              - pattern-inside: |
                  import * as $CLIENT from 'https'
                  ...
              - pattern-inside: |
                  const $CLIENT = require('https')
                  ...
              - pattern-inside: |
                  import $CLIENT from 'node:http'
                  ...
              - pattern-inside: |
                  import * as $CLIENT from 'node:http'
                  ...
              - pattern-inside: |
                  const $CLIENT = require('node:http')
                  ...
              - pattern-inside: |
                  import $CLIENT from 'node:https'
                  ...
              - pattern-inside: |
                  import * as $CLIENT from 'node:https'
                  ...
              - pattern-inside: |
                  const $CLIENT = require('node:https')
                  ...
              # the `request` package — the name that caused the most noise
              - pattern-inside: |
                  import $CLIENT from 'request'
                  ...
              - pattern-inside: |
                  const $CLIENT = require('request')
                  ...
              # other common server-side clients
              - pattern-inside: |
                  import $CLIENT from 'got'
                  ...
              - pattern-inside: |
                  const $CLIENT = require('got')
                  ...
              - pattern-inside: |
                  import $CLIENT from 'node-fetch'
                  ...
              - pattern-inside: |
                  const $CLIENT = require('node-fetch')
                  ...
              - pattern-inside: |
                  import $CLIENT from 'superagent'
                  ...
              - pattern-inside: |
                  const $CLIENT = require('superagent')
                  ...
              - pattern-inside: |
                  import * as $CLIENT from 'undici'
                  ...
              - pattern-inside: |
                  const $CLIENT = require('undici')
                  ...
          - pattern-either:
              - pattern: $CLIENT($URL, ...)
              - pattern: $CLIENT.get($URL, ...)
              - pattern: $CLIENT.post($URL, ...)
              - pattern: $CLIENT.put($URL, ...)
              - pattern: $CLIENT.patch($URL, ...)
              - pattern: $CLIENT.delete($URL, ...)
              - pattern: $CLIENT.head($URL, ...)
              - pattern: $CLIENT.options($URL, ...)
              - pattern: $CLIENT.request($URL, ...)
              - pattern: $CLIENT.stream($URL, ...)
          - focus-metavariable: $URL

      # 3. The same clients reached through a local alias or a configured
      #    instance, which is how they are normally used:
      #      const client = url.startsWith('https') ? https : http;
      #      const client = axios.create({ baseURL });
      #    Still gated on $CLIENT being a real imported HTTP client.
      - patterns:
          - pattern-either: *http-client-import
          - pattern-inside: |
              const $C = <... $CLIENT ...>;
              ...
          - pattern-either:
              - pattern: $C($URL, ...)
              - pattern: $C.get($URL, ...)
              - pattern: $C.post($URL, ...)
              - pattern: $C.put($URL, ...)
              - pattern: $C.patch($URL, ...)
              - pattern: $C.delete($URL, ...)
              - pattern: $C.head($URL, ...)
              - pattern: $C.options($URL, ...)
              - pattern: $C.request($URL, ...)
              - pattern: $C.stream($URL, ...)
          - focus-metavariable: $URL
