version: "2"
run:
  go: "1.22"
  tests: true
linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - dupl
    - errcheck
    - errorlint
    - exhaustive
    - forbidigo
    - funlen
    - gocognit
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - nestif
    - nilerr
    - nilnil
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    depguard:
      rules:
        application-purity:
          files:
            - '**/internal/application/**'
          deny:
            - pkg: github.com/vektcore/cortex/internal/infrastructure
              desc: application talks to infrastructure via ports, not direct imports
            - pkg: github.com/vektcore/cortex/internal/interfaces
              desc: application must not depend on interfaces
        domain-purity:
          files:
            - '**/internal/domain/**'
          deny:
            - pkg: github.com/vektcore/cortex/internal/application
              desc: domain must not depend on application
            - pkg: github.com/vektcore/cortex/internal/infrastructure
              desc: domain must not depend on infrastructure
            - pkg: github.com/vektcore/cortex/internal/interfaces
              desc: domain must not depend on interfaces
            - pkg: net/http
              desc: no I/O in domain
            - pkg: os
              desc: no I/O in domain (except for errors via stdlib types)
            - pkg: database/sql
              desc: no persistence in domain
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: use the logger; fmt.Print is reserved for CLI output layer
        - pattern: ^panic\(.*\)$
          msg: do not panic; return a Result/error
    funlen:
      lines: 80
      statements: 50
    gocognit:
      min-complexity: 18
    gocyclo:
      min-complexity: 12
    revive:
      severity: warning
      rules:
        - name: exported
        - name: var-naming
        - name: unused-parameter
        - name: early-return
        - name: indent-error-flow
        - name: empty-block
        - name: superfluous-else
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - funlen
          - gocognit
          - gocyclo
          - gosec
        path: _test\.go
      - linters:
          - forbidigo
        path: cmd/
      - linters:
          - forbidigo
        path: internal/interfaces/cli/
      # Cortex's whole purpose is running external scanners against a path the
      # user configured. G204 flags exactly that, and there is no version of
      # this product where it does not exec a subprocess with a variable path.
      - linters:
          - gosec
        text: G204
        path: internal/infrastructure/(scanners|git)/
      # Test switches deliberately cover a subset of an enum.
      - linters:
          - exhaustive
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofmt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/vektcore/cortex)
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
